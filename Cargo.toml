[package]
name = "shopping"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
memchr = "2.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = "0.15"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
